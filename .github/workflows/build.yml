name: Build Cross-Platform

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2.0" --locked
      
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
          sudo apt-get install -y libfuse2
      
      - name: Install frontend dependencies
        working-directory: 03_Kod/ada-tutun-desktop
        run: npm ci
      
      - name: Build Tauri (Linux)
        working-directory: 03_Kod/ada-tutun-desktop
        run: cargo tauri build
      
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ada-tutun-linux-deb
          path: 03_Kod/ada-tutun-desktop/src-tauri/target/release/bundle/deb/*.deb

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2.0" --locked
      
      - name: Install frontend dependencies
        working-directory: 03_Kod/ada-tutun-desktop
        run: npm ci
      
      - name: Build Tauri (Windows)
        working-directory: 03_Kod/ada-tutun-desktop
        run: cargo tauri build
        shell: bash
      
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ada-tutun-windows
          path: |
            03_Kod/ada-tutun-desktop/src-tauri/target/release/bundle/msi/*.msi
            03_Kod/ada-tutun-desktop/src-tauri/target/release/bundle/nsis/*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2.0" --locked
      
      - name: Install frontend dependencies
        working-directory: 03_Kod/ada-tutun-desktop
        run: npm ci
      
      - name: Build Tauri (macOS)
        working-directory: 03_Kod/ada-tutun-desktop
        run: cargo tauri build
        env:
          APPLE_SIGNING_IDENTITY: "-"
      
      - name: Ad-hoc sign app bundle
        run: |
          APP_PATH="03_Kod/ada-tutun-desktop/src-tauri/target/release/bundle/macos/Ada Tütün.app"
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --verbose=4 "$APP_PATH"
      
      - name: Create DMG
        run: |
          APP_PATH="03_Kod/ada-tutun-desktop/src-tauri/target/release/bundle/macos/Ada Tütün.app"
          DMG_PATH="03_Kod/ada-tutun-desktop/src-tauri/target/release/bundle/dmg"
          mkdir -p "$DMG_PATH"
          hdiutil create -volname "Ada Tütün" -srcfolder "$APP_PATH" -ov -format UDZO "$DMG_PATH/Ada Tütün 0.1.0.dmg"
      
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ada-tutun-macos
          path: |
            03_Kod/ada-tutun-desktop/src-tauri/target/release/bundle/dmg/*.dmg
            03_Kod/ada-tutun-desktop/src-tauri/target/release/bundle/macos/*.app