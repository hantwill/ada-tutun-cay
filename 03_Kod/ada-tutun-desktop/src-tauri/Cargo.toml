[package]
name = "ada-tutun"
version = "0.1.0"
description = "Ada Tütün POS — Satış ve Stok Yönetim"
authors = ["NOVA"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = ["tauri-codegen"] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
tauri-plugin-dialog = "2"
# chrono ve uuid suan kullanilmiyor — sadelestirildi
